<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hyperi</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- Persistent top status bar: at-a-glance system stats, always
         visible regardless of which view is active. Rendered independently
         of #content so switching views (or typing in a form) never wipes
         it — see app.js's renderStatusBar(), called on every poll tick. -->
    <header id="status-bar" class="status-bar"></header>

    <!-- Dynamic content area: everything the agent/UI needs to show lives
         here. Exactly one "view" is rendered at a time — see app.js's
         render() / view registry. -->
    <main id="content" class="content"></main>

    <!-- Persistent bottom bar: the only fixed chrome. Text input + mic +
         nav. Nothing else is ever pinned on screen. -->
    <footer class="bar">
      <button
        id="nav-btn"
        class="bar-icon-btn nav-btn"
        title="Goals & directives"
        aria-label="Goals & directives"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M4 4h16v16H4z" stroke-linejoin="round"/>
          <path d="M8 9h8M8 13h8M8 17h5" stroke-linecap="round"/>
        </svg>
        <span id="nav-badge" class="nav-badge hidden"></span>
      </button>

      <form id="bar-form" class="bar-form" autocomplete="off">
        <textarea
          id="bar-input"
          class="bar-input"
          placeholder="Tell hyperi what to do…"
          rows="1"
        ></textarea>
      </form>

      <button
        id="mic-btn"
        class="bar-icon-btn"
        title="Speak instead"
        aria-label="Speak instead"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="9" y="3" width="6" height="11" rx="3"/>
          <path d="M5 11a7 7 0 0 0 14 0M12 18v3" stroke-linecap="round"/>
        </svg>
      </button>

      <button id="send-btn" class="bar-icon-btn bar-send" title="Send" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M4 12h15M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </footer>
  </div>

  <!-- Status-bar detail modal: opened by clicking a chip in #status-bar
       (see app.js's openModal/openGoalsModal/openModelModal/openAutonomyModal).
       Lives outside .app so it always overlays everything regardless of
       which view is active underneath. -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal-panel">
      <div class="modal-header">
        <h2 id="modal-title"></h2>
        <button id="modal-close" class="icon-btn" title="Close" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
