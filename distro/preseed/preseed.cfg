# NOTE: Ubuntu 24.04 uses the Subiquity installer which does NOT support
# debian-installer preseed (d-i) format. This file is kept for reference only.
#
# For unattended Ubuntu 24.04 installs, use the autoinstall YAML format instead.
# See: distro/preseed/autoinstall.yaml
#
# The preseed format below would only work with the legacy debian-installer,
# which is not the default for Ubuntu 24.04 Server ISOs.

# ── Locale ─────────────────────────────────────────────────────────────────────
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

# ── Network ───────────────────────────────────────────────────────────────────
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string hyperios
d-i netcfg/get_domain string local

# ── Mirror ─────────────────────────────────────────────────────────────────────
d-i mirror/country string US
d-i mirror/http/mirror select archive.ubuntu.com
d-i mirror/http/directory string /ubuntu
d-i mirror/http/proxy string

# ── Partitioning ───────────────────────────────────────────────────────────────
d-i partman-auto/method string lvm
d-i partman-auto/disk string /dev/sda
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# ── Users ─────────────────────────────────────────────────────────────────────
d-i passwd/user-fullname string HyperiOS Admin
d-i passwd/username string admin
# TODO: replace with a real bcrypt hash before use: openssl passwd -6 'yourpassword'
d-i passwd/user-password-crypted password $6$rounds=4096$CHANGEME
d-i passwd/root-login boolean false

# ── Time zone ─────────────────────────────────────────────────────────────────
d-i time/zone string UTC
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

# ── Packages ──────────────────────────────────────────────────────────────────
d-i tasksel/first multiselect minimal
d-i pkgsel/include string openssh-server curl git cloud-init
d-i pkgsel/upgrade select full-upgrade
d-i pkgsel/update-policy select unattended-upgrades

# ── Boot loader ───────────────────────────────────────────────────────────────
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string /dev/sda

# ── Post-install ──────────────────────────────────────────────────────────────
d-i preseed/late_command string \
    in-target sh -c 'systemctl enable cloud-init cloud-init-local cloud-config cloud-final'

d-i finish-install/reboot_in_progress note
